<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" role="img" aria-labelledby="title desc">
  <title id="title">Raj Sports</title>
  <desc id="desc">Four rising grounds are joined by one continuous coaching route beside the Raj Sports wordmark.</desc>
  <defs>
    <mask id="connected-stride" maskUnits="userSpaceOnUse" x="0" y="0" width="168" height="108">
      <rect width="168" height="108" fill="black"/>
      <g transform="translate(16 0) skewX(-10)">
        <rect x="10" y="61" width="27" height="32" rx="8" fill="white"/>
        <rect x="43" y="47" width="27" height="46" rx="8" fill="white"/>
        <rect x="76" y="32" width="27" height="61" rx="8" fill="white"/>
        <rect x="109" y="15" width="27" height="78" rx="8" fill="white"/>
        <path d="M12 81 H49 V72 H68 V64 H86 V55 H104 V46 H134"
              fill="none" stroke="black" stroke-width="7"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </mask>
  </defs>
  <g transform="translate(8 16)">
    <rect width="168" height="108" fill="#14543e" mask="url(#connected-stride)"/>
  </g>
  <text x="194" y="89"
        fill="#17191a"
        font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif"
        font-size="55"
        font-weight="760"
        letter-spacing="-1.4">RAJ</text>
  <text x="314" y="89"
        fill="#14543e"
        font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif"
        font-size="55"
        font-weight="620"
        letter-spacing="1.4">SPORTS</text>
</svg>
