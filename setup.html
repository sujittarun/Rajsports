<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>Setup · Raj Sports</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/css/app.css?v=14">
<style>
  body.setup-page { padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); }
  .setup-wrap { max-width: 760px; }
  .setup-back {
    display: inline-flex; align-items: center; min-height: 42px; margin: 13px 0 18px;
    color: var(--volt); font-size: 13px; font-weight: 650;
  }
  .setup-hero { margin: 0 0 30px; }
  .setup-hero h1 { font-size: clamp(29px, 8vw, 42px); letter-spacing: -0.04em; }
  .setup-hero p { max-width: 560px; margin-top: 10px; color: var(--text-2); font-size: 16px; line-height: 1.55; }
  .setup-group { margin: 0 0 28px; }
  .setup-group h2 { margin: 0 0 11px; font-size: 17px; }
  .setup-menu { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r-card); overflow: hidden; }
  .setup-link {
    display: grid; grid-template-columns: 36px minmax(0,1fr) auto 14px;
    gap: 11px; align-items: center; min-height: 86px; padding: 14px 15px;
    border-bottom: 1px solid var(--hair);
    transition: background-color 160ms var(--ease), transform 140ms var(--spring);
  }
  .setup-link:last-child { border-bottom: 0; }
  .setup-link:active { background: var(--volt-haze); transform: scale(.993); }
  .setup-icon { width: 30px; height: 30px; color: var(--volt); }
  .setup-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .setup-link-title { display: block; font-size: 14px; font-weight: 660; line-height: 1.25; }
  .setup-link-sub { display: block; margin-top: 3px; color: var(--text-3); font-size: 11.5px; line-height: 1.35; }
  .setup-link-state { color: var(--text-2); font-size: 11.5px; text-align: right; white-space: nowrap; }
  .setup-chevron { color: var(--volt); font-size: 24px; line-height: 1; }
  .setup-foot { color: var(--text-3); font-size: 12px; margin: -5px 2px 30px; }
  .setup-section-head { margin: 13px 0 20px; }
  .setup-section-back { display: inline-flex; min-height: 40px; align-items: center; color: var(--volt); font-size: 13px; font-weight: 650; }
  .setup-section-head h1 { margin-top: 9px; font-size: 27px; }
  .setup-section-head p { margin: 7px 0 0; color: var(--text-2); font-size: 13px; line-height: 1.5; }
  .note {
    padding: 13px 15px; border-radius: var(--r-card); margin-bottom: 16px;
    background: var(--raised); border: 1px solid var(--hair);
    color: var(--text-2); font-size: 12.5px; line-height: 1.6;
  }
  .note b { color: var(--text); font-weight: 640; }
  .scope { font-size: 11.5px; color: var(--text-3); }
  .amt { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
  .grp {
    display: flex; align-items: center; gap: 9px;
    padding: 12px 16px 9px; background: var(--sunken);
    border-bottom: 1px solid var(--hair);
  }
  .grp > span:first-child { flex: 1; }
  @media (max-width: 430px) {
    .setup-link { grid-template-columns: 32px minmax(0,1fr) 12px; min-height: 91px; padding: 13px; }
    .setup-link-state { grid-column: 2; text-align: left; margin-top: -7px; }
    .setup-chevron { grid-column: 3; grid-row: 1 / span 2; }
  }
</style>
</head>
<body class="setup-page">
  <header class="topbar"></header>

  <main class="wrap setup-wrap">
    <div id="setupHead"></div>
    <div id="view"></div>
  </main>

<script src="assets/js/cloud.js?v=14"></script>
<script src="assets/js/core.js?v=14"></script>
<script>
(function () {
  if (!App.requireStaff()) return;
  App.shell("setup", "Setup");
  RS.track("page_view");

  var view = App.$("#view"), head = App.$("#setupHead"), ref = null;
  var TABS = ["home", "fees", "centres", "sports", "staff", "whatsapp", "activity"];
  var tab = (location.hash || "#home").slice(1);
  if (TABS.indexOf(tab) < 0) tab = "home";

  App.skeleton(view, 4);
  RS.reference().then(function (r) { ref = r; render(); })
                .catch(function (e) { App.fail(view, e); });

  window.addEventListener("hashchange", function () {
    tab = (location.hash || "#home").slice(1);
    if (TABS.indexOf(tab) < 0) tab = "home";
    render();
  });
  function render() {
    if (tab === "home")     return renderHome();
    var info = {
      fees: ["Fees & plans", "Set default rates, exceptions and longer plans."],
      centres: ["Centres, batches & coaches", "Manage venues, class times and who teaches."],
      sports: ["Sports offered", "Choose the sports students can join."],
      staff: ["Attendance staff", "Who takes the register, and at which centres."],
      whatsapp: ["WhatsApp reminders", "Review the sending mode and parent message setup."],
      activity: ["Activity log", "Review recent setup changes."]
    }[tab];
    sectionHead(info[0], info[1]);
    if (tab === "fees")     return renderFees();
    if (tab === "centres")  return renderCentres();
    if (tab === "sports")   return renderSports();
    if (tab === "staff")    return renderStaff();
    if (tab === "activity") return renderActivity();
    return renderWhatsapp();
  }
  function sectionHead(title, sub) {
    head.innerHTML = '<div class="setup-section-head">' +
      '<a class="setup-section-back" href="#home">‹ Setup home</a>' +
      '<h1>' + App.esc(title) + '</h1><p>' + App.esc(sub) + '</p></div>';
  }
  function icon(kind) {
    var paths = {
      centres: '<path d="M4 20V9l8-6 8 6v11M8 20v-6h8v6M2 20h20"/>',
      sports: '<path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"/><path d="M8 6H4v2a4 4 0 0 0 4 4M16 6h4v2a4 4 0 0 1-4 4M12 12v5M8 21h8M9 17h6"/>',
      fees: '<path d="M4 7h11a4 4 0 0 1 0 8H4M4 11h14M4 15h6m0 0 6 6"/>',
      whatsapp: '<path d="M20 11a8 8 0 0 1-12 7l-4 1 1-4a8 8 0 1 1 15-4Z"/><path d="M9 8c1 3 2 4 5 5"/>',
      activity: '<path d="M7 4h10v17H7zM9 2h6v4H9zM10 10h5M10 14h5M10 18h4"/>',
      staff: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>'
    };
    return '<span class="setup-icon"><svg viewBox="0 0 24 24" aria-hidden="true">' + paths[kind] + '</svg></span>';
  }
  function menuRow(hash, kind, title, sub, state) {
    return '<a class="setup-link" href="#' + hash + '">' + icon(kind) +
      '<span><span class="setup-link-title">' + App.esc(title) + '</span>' +
      '<span class="setup-link-sub">' + App.esc(sub) + '</span></span>' +
      '<span class="setup-link-state">' + App.esc(state || "") + '</span>' +
      '<span class="setup-chevron">›</span></a>';
  }
  function renderHome() {
    head.innerHTML = '<a class="setup-back" href="today.html">‹ Back to app</a>' +
      '<div class="setup-hero"><h1>Set up Raj Sports</h1>' +
      '<p>Manage the details that change how fees, classes and reminders work.</p></div>';
    view.innerHTML = '<div class="setup-group"><h2>Coaching setup</h2><div class="setup-menu" id="coachMenu"></div></div>' +
      '<div class="setup-group"><h2>Communication & account</h2><div class="setup-menu" id="accountMenu"></div></div>' +
      '<div class="setup-foot">Changes here affect the whole academy.</div>';
    var centres = ref.centres.filter(function (x) { return x.active !== false; }).length;
    var batches = ref.batches.filter(function (x) { return x.active !== false; }).length;
    var sports = ref.sports.filter(function (x) { return x.active !== false; }).length;
    App.$("#coachMenu").innerHTML =
      menuRow("centres", "centres", "Centres, batches & coaches", "Venues, class times and who teaches",
        centres + " centres · " + batches + " batches") +
      menuRow("sports", "sports", "Sports offered", "The sports students can join", sports + " active") +
      menuRow("staff", "staff", "Attendance staff", "Who takes the register, and where", "Loading") +
      menuRow("fees", "fees", "Fees & plans", "Default rates, exceptions and longer plans", "Loading");
    App.$("#accountMenu").innerHTML =
      menuRow("whatsapp", "whatsapp", "WhatsApp reminders", "Sending mode and parent message setup", "Loading") +
      menuRow("activity", "activity", "Activity log", "Review recent setup changes", "");
    Promise.all([RS.feeRules(), RS.tenantConfig(), RS.staffScopes()]).then(function (r) {
      var fee = App.$('a[href="#fees"] .setup-link-state');
      var wa = App.$('a[href="#whatsapp"] .setup-link-state');
      var st = App.$('a[href="#staff"] .setup-link-state');
      if (fee) fee.textContent = (r[0] || []).filter(function (x) { return x.active !== false; }).length + " rates";
      var w = (r[1] || {}).whatsapp || {};
      if (wa) wa.textContent = w.mode === "auto" ? "Automatic" : "Manual";
      if (st) {
        var n = (r[2] || []).filter(function (x) { return x.active !== false; }).length;
        st.textContent = n ? n + (n === 1 ? " person" : " people") : "None yet";
      }
    }).catch(function () {});
  }
  function refresh(after) {
    return RS.reference(true).then(function (r) { ref = r; if (after) after(); });
  }

  /* ============================================================
     FEES
     ============================================================ */
  function renderFees() {
    App.skeleton(view, 4);
    RS.feeRules().then(function (rules) {
      view.innerHTML =
        '<div class="note reveal">Set one rate and it covers everyone. Add a more specific rate ' +
        'only where reality differs: a rate for a sport beats the overall default, a rate for a ' +
        'centre and sport together beats that, and a fee typed on a single student beats them all. ' +
        '<b>Every reminder quotes whichever one wins.</b></div>' +
        '<div class="card reveal"><div class="card-hd"><h2>Rates</h2>' +
          '<button class="btn btn-sm btn-primary" id="addRule">＋ Rate</button></div>' +
          '<div id="rules"></div></div>';
      App.$("#addRule").addEventListener("click", function () { feeSheet(null); });

      var host = App.$("#rules");
      if (!rules.length) {
        host.innerHTML = '<div class="empty"><div class="empty-t">No rates set yet</div>' +
          '<div class="small">Start with one monthly fee for everyone, then add exceptions.</div>' +
          '<button class="btn btn-primary mt-2" id="first">Set the default fee</button></div>';
        App.$("#first").addEventListener("click", function () { feeSheet(null); });
        return;
      }
      // Listed most specific first: the order the engine resolves in.
      var rank = function (r) {
        return r.member_id ? 50 : r.batch_id ? 45 : (r.centre_id && r.sport) ? 40
             : r.sport ? 30 : r.centre_id ? 20 : 10;
      };
      rules.sort(function (a, b) { return rank(b) - rank(a); });

      host.innerHTML = '<div class="list">' + rules.map(function (r, i) {
        return '<div class="row row-in" style="animation-delay:' + (i * 32) + 'ms" data-r="' + r.id + '">' +
          '<div class="row-main"><div class="row-t">' + App.esc(r.label || scopeName(r)) + "</div>" +
          '<div class="scope">' + App.esc(scopeName(r)) +
            (r.admission_fee > 0 ? " · joining " + App.money(r.admission_fee) : "") +
            (r.active ? "" : " · off") + "</div></div>" +
          '<div class="row-end"><div class="amt">' + App.money(r.monthly_amount) +
            '<span class="small muted">/mo</span></div></div></div>';
      }).join("") + "</div>";

      App.$$("[data-r]", host).forEach(function (n) {
        n.addEventListener("click", function () {
          feeSheet(rules.filter(function (x) { return x.id === +n.dataset.r; })[0]);
        });
      });
    }).catch(function (e) { App.fail(view, e); });
  }

  function scopeName(r) {
    var bits = [];
    if (r.centre_id) bits.push((ref.centreById[r.centre_id] || {}).short_name || "Centre");
    if (r.sport)     bits.push(App.cap(r.sport));
    if (r.batch_id)  bits.push((ref.batchById[r.batch_id] || {}).name || "Batch");
    if (r.member_id) bits.push("one student");
    return bits.length ? bits.join(" · ") : "Everyone";
  }

  function feeSheet(r) {
    App.sheet({
      title: r ? "Edit rate" : "New rate",
      html:
        '<div class="field"><label>Name <span class="hint">optional</span></label>' +
          '<input class="input" id="lb" value="' + App.esc(r ? (r.label || "") : "") +
          '" placeholder="Basketball at BTV"></div>' +
        '<div class="field"><label>Applies to</label><div class="grid-2">' +
          '<select class="select" id="ce" style="margin-bottom:8px"><option value="">All centres</option>' +
            ref.centres.map(function (c) { return '<option value="' + c.id + '"' +
              (r && r.centre_id === c.id ? " selected" : "") + ">" +
              App.esc(c.short_name || c.name) + "</option>"; }).join("") + "</select>" +
          '<select class="select" id="sp" style="margin-bottom:8px"><option value="">All sports</option>' +
            ref.sports.map(function (s) { return '<option value="' + App.esc(s.code) + '"' +
              (r && r.sport === s.code ? " selected" : "") + ">" + App.esc(s.name) + "</option>"; }).join("") +
        "</select></div>" +
        '<div class="hint">Leave both on “All” for the rate everyone falls back to.</div></div>' +
        '<div class="grid-2">' +
          '<div class="field"><label>Monthly fee</label><input class="input" id="am" type="number" ' +
            'inputmode="numeric" value="' + App.esc(r ? r.monthly_amount : "") + '"></div>' +
          '<div class="field"><label>Joining fee <span class="hint">one time</span></label>' +
            '<input class="input" id="ad" type="number" inputmode="numeric" value="' +
            App.esc(r ? (r.admission_fee || 0) : 0) + '"></div>' +
        "</div>" +
        '<div class="field"><label>Discounted longer plans <span class="hint">optional</span></label>' +
          '<div class="grid-2">' +
            '<input class="input" id="p3" type="number" inputmode="numeric" style="margin-bottom:8px" ' +
              'placeholder="3 month total" value="' + App.esc(planVal(r, 3)) + '">' +
            '<input class="input" id="p6" type="number" inputmode="numeric" style="margin-bottom:8px" ' +
              'placeholder="6 month total" value="' + App.esc(planVal(r, 6)) + '">' +
          "</div><div class=\"hint\">Blank means the monthly fee times the number of months.</div></div>" +
        (r ? '<label class="small" style="display:flex;gap:9px;align-items:center;margin-bottom:14px">' +
             '<input type="checkbox" id="ac"' + (r.active ? " checked" : "") + "> Active</label>" : "") +
        '<button class="btn btn-primary btn-block" id="save">Save rate</button>' +
        (r ? '<button class="btn btn-block mt-1" id="del" style="color:var(--overdue)">Delete</button>' : ""),
      onMount: function (el) {
        App.$("#save", el).addEventListener("click", function () {
          var btn = this, amt = Number(App.$("#am", el).value);
          if (!amt || amt <= 0) { App.toast("Enter a monthly fee.", "bad"); return; }
          var plans = {};
          if (App.$("#p3", el).value) plans["3"] = Number(App.$("#p3", el).value);
          if (App.$("#p6", el).value) plans["6"] = Number(App.$("#p6", el).value);
          btn.disabled = true; btn.textContent = "Saving…";
          RS.saveFeeRule(r && r.id, {
            label: App.$("#lb", el).value.trim() || null,
            centre_id: App.$("#ce", el).value ? +App.$("#ce", el).value : null,
            sport: App.$("#sp", el).value || null,
            monthly_amount: amt,
            admission_fee: Number(App.$("#ad", el).value) || 0,
            plan_amounts: plans,
            active: r ? App.$("#ac", el).checked : true
          }).then(function () { App.closeSheet(); App.toast("Rate saved", "good"); renderFees(); })
            .catch(function (e) { btn.disabled = false; btn.textContent = "Save rate"; App.toast(e.message, "bad"); });
        });
        var d = App.$("#del", el);
        if (d) d.addEventListener("click", function () {
          App.confirm({ title: "Delete this rate?",
            body: "Students on it fall back to the next matching rate.",
            confirm: "Delete", danger: true }).then(function (yes) {
            if (!yes) return;
            RS.deleteFeeRule(r.id).then(function () {
              App.closeSheet(); App.toast("Deleted"); renderFees();
            }).catch(function (e) { App.toast(e.message, "bad"); });
          });
        });
      }
    });
  }
  function planVal(r, n) {
    if (!r || !r.plan_amounts) return "";
    return r.plan_amounts[String(n)] != null ? r.plan_amounts[String(n)] : "";
  }

  /* ============================================================
     CENTRES, BATCHES AND COACHES
     ============================================================ */
  function renderCentres() {
    view.innerHTML =
      '<div class="note reveal">Add a venue, add a batch, or move a batch time. A centre or batch ' +
      'that already has students can be <b>closed but never deleted</b>, so past fees always still ' +
      'add up.</div>' +
      '<div class="card reveal"><div class="card-hd"><h2>Centres and batches</h2>' +
      '<button class="btn btn-sm btn-primary" id="addC">＋ Centre</button></div><div id="cs"></div></div>' +
      '<div class="card section reveal"><div class="card-hd"><h2>Coaches</h2>' +
      '<button class="btn btn-sm" id="addCo">＋ Coach</button></div><div id="co"></div></div>';

    App.$("#addC").addEventListener("click", function () { centreSheet(null); });
    App.$("#addCo").addEventListener("click", function () { coachSheet(null); });

    var host = App.$("#cs");
    var live = ref.centres.filter(function (c) { return c.active; });
    if (!live.length) {
      App.empty(host, "No centres yet", "Add the first venue you coach at.");
    } else {
      host.innerHTML = live.map(function (c) {
        var bs = ref.batches.filter(function (b) { return b.centre_id === c.id && b.active; });
        return '<div class="grp"><span class="eyebrow">' + App.esc(c.short_name || c.name) + "</span>" +
            '<button class="btn btn-sm" data-ec="' + c.id + '">Edit</button>' +
            '<button class="btn btn-sm" data-ab="' + c.id + '">＋ Batch</button></div>' +
          '<div class="list">' + (bs.length ? bs.map(function (b) {
            var coach = ref.coaches.filter(function (x) { return x.id === b.coach_id; })[0];
            return '<div class="row"><div class="row-main"><div class="row-t">' + App.esc(b.name) +
              (b.sport ? '  <span class="pill">' + App.esc(App.cap(b.sport)) + "</span>" : "") + "</div>" +
              '<div class="row-s">' + App.esc(App.days(b.days) + " · " + App.timeOf(b.start_time) +
                " to " + App.timeOf(b.end_time) + (coach ? " · " + coach.name : "")) + "</div></div>" +
              '<div class="row-end btn-row" style="flex-wrap:nowrap">' +
                '<button class="btn btn-sm" data-tb="' + b.id + '">Timing</button>' +
                '<button class="btn btn-sm" data-eb="' + b.id + '">Edit</button></div></div>';
          }).join("") : '<div class="row"><span class="muted small">No batches yet</span></div>') + "</div>";
      }).join("");

      App.$$("[data-ec]", host).forEach(function (b) { b.addEventListener("click", function () {
        centreSheet(ref.centreById[+b.dataset.ec]); }); });
      App.$$("[data-ab]", host).forEach(function (b) { b.addEventListener("click", function () {
        batchSheet(null, +b.dataset.ab); }); });
      App.$$("[data-eb]", host).forEach(function (b) { b.addEventListener("click", function () {
        var bt = ref.batchById[+b.dataset.eb]; batchSheet(bt, bt.centre_id); }); });
      App.$$("[data-tb]", host).forEach(function (b) { b.addEventListener("click", function () {
        timingSheet(ref.batchById[+b.dataset.tb]); }); });
    }

    var ch = App.$("#co");
    if (!ref.coaches.length) {
      App.empty(ch, "No coaches yet", "Add one to assign them to a batch.");
    } else {
      ch.innerHTML = '<div class="list">' + ref.coaches.map(function (c) {
        return '<div class="row" data-c="' + c.id + '">' +
          '<div class="avatar">' + App.esc(App.initials(c.name)) + "</div>" +
          '<div class="row-main"><div class="row-t">' + App.esc(c.name) + "</div>" +
          '<div class="row-s">' + App.esc(App.cap(c.role) +
            (c.phone ? " · " + App.phone10(c.phone) : "")) + "</div></div></div>";
      }).join("") + "</div>";
      App.$$("[data-c]", ch).forEach(function (n) {
        n.addEventListener("click", function () {
          coachSheet(ref.coaches.filter(function (c) { return c.id === +n.dataset.c; })[0]);
        });
      });
    }
  }

  /* ---------------- collection accounts ----------------
     Raj coaches at venues he does not own, and several of them want the
     parents' money in THEIR account. So "where does this fee get paid"
     is a per-centre and sometimes per-batch fact.

     The resolver lives in Postgres (resolve_upi), same as the fee chain,
     so the id a parent is asked to pay and the one shown here cannot
     drift apart. These fields only ever set one level; the fallback line
     underneath states what happens when they are left blank. */
  var UPI_RE = /^[a-zA-Z0-9._%+-]{2,64}@[a-zA-Z][a-zA-Z0-9.-]{1,32}$/;

  function upiFields(row, whatBlankMeans) {
    return '<div class="field"><label>UPI id for fees ' +
        '<span class="hint">' + App.esc(whatBlankMeans) + '</span></label>' +
        '<input class="input" id="upi" inputmode="email" autocapitalize="off" ' +
        'spellcheck="false" placeholder="name@bank" value="' +
        App.esc((row && row.upi_id) || "") + '"></div>' +
      '<div class="field"><label>Payee name <span class="hint">what the parent sees in their UPI app</span></label>' +
        '<input class="input" id="upin" value="' + App.esc((row && row.upi_name) || "") + '"></div>' +
      '<p class="small muted" id="upiFallback" style="margin:-6px 0 14px"></p>';
  }

  /* Say where the number would come from if this box stays empty, in the
     same words the Fees screen uses for a rate. */
  function upiFallback(el, centreId, batchId) {
    var host = App.$("#upiFallback", el);
    if (!host) return;
    RS.resolveUpi(centreId || null, batchId || null).then(function (u) {
      host.textContent = !u || !u.vpa
        ? "Left blank, no account is quoted and reminders go out without a payment line."
        : "Left blank, parents are asked to pay " + u.vpa +
          (u.source === "academy" ? " (the academy account)" : " (from the centre)") + ".";
    }).catch(function () { host.textContent = ""; });
  }

  function readUpi(el) {
    var v = App.$("#upi", el).value.trim();
    if (v && !UPI_RE.test(v)) return { error: "That does not look like a UPI id. It should read like name@bank." };
    return { upi: v || null, name: App.$("#upin", el).value.trim() || null };
  }

  function saveUpi(kind, id, u) {

  function dayChips(sel) {
    return '<div class="chips" id="days">' + [1,2,3,4,5,6,7].map(function (d) {
      return '<button class="chip" type="button" data-d="' + d + '" aria-pressed="' +
        (sel.indexOf(d) >= 0) + '">' + ["","Mon","Tue","Wed","Thu","Fri","Sat","Sun"][d] + "</button>";
    }).join("") + "</div>";
  }
  function readDays(el) {
    return App.$$("#days .chip", el).filter(function (c) {
      return c.getAttribute("aria-pressed") === "true"; }).map(function (c) { return +c.dataset.d; });
  }
  function wireDays(el) {
    App.$$("#days .chip", el).forEach(function (c) {
      c.addEventListener("click", function () {
        c.setAttribute("aria-pressed", String(c.getAttribute("aria-pressed") !== "true"));
      });
    });
  }

  /* Moving a batch time is the most common edit and the one parents

  function timingSheet(b) {
    var n = 0;
    App.sheet({
      title: "Timing for " + b.name,
      html:
        '<p class="small muted">Now ' + App.esc(App.days(b.days) + " · " +
          App.timeOf(b.start_time) + " to " + App.timeOf(b.end_time)) + "</p>" +
        '<div class="field"><label>Days</label>' + dayChips(b.days || []) + "</div>" +
        '<div class="grid-2">' +
          '<div class="field"><label>Start</label><input class="input" id="st" type="time" value="' +
            App.esc(String(b.start_time).slice(0, 5)) + '"></div>' +
          '<div class="field"><label>End</label><input class="input" id="et" type="time" value="' +
            App.esc(String(b.end_time).slice(0, 5)) + '"></div>' +
        "</div>" +
        '<div id="who" class="small muted mb-2"></div>' +
        '<button class="btn btn-primary btn-block" id="save">Change timing</button>',
      onMount: function (el) {
        wireDays(el);
        // Say who is affected BEFORE the change, not after.
        RS.students().then(function (all) {
          n = all.reduce(function (a, m) {
            return a + (m.enrollments || []).filter(function (e) {
              return e.batch_id === b.id && e.status === "active"; }).length; }, 0);
          App.$("#who", el).textContent = n
            ? n + (n === 1 ? " student is" : " students are") + " in this batch. Let their parents know."
            : "No students are in this batch yet.";
        }).catch(function () {});

        App.$("#save", el).addEventListener("click", function () {
          var btn = this, days = readDays(el);
          var st = App.$("#st", el).value, et = App.$("#et", el).value;
          if (!days.length) { App.toast("Pick at least one day.", "bad"); return; }
          if (!st || !et || et <= st) { App.toast("End time must be after the start time.", "bad"); return; }
          btn.disabled = true; btn.textContent = "Saving…";
          RS.updateBatchTiming(b.id, days, st, et).then(function () {
            App.closeSheet();
            App.toast("Timing changed" + (n ? ", tell the " + n + " parents" : ""), "good");
            refresh(renderCentres);
          }).catch(function (e) {
            btn.disabled = false; btn.textContent = "Change timing";
            App.toast(e.message || "Could not save.", "bad");
          });
        });
      }
    });
  }

  /* ---------------- attendance staff ----------------
     Coaches sign in with their own Supabase account and see one screen:
     the register, for their centres only. Everything else the app can do
     is closed to them at the database, not by hiding a button, so this
     page only ever edits WHERE someone may mark, never WHAT they may
     see. Adding the login itself is an account job, not a setup one. */
  function renderStaff() {
    App.skeleton(view, 3);
    RS.staffScopes().then(function (rows) {
      var centreName = function (id) {
        var c = ref.centreById[id];
        return c ? (c.short_name || c.name) : "a closed centre";
      };
      view.innerHTML =
        '<div class="card"><div class="card-hd"><h2>Who takes the register</h2>' +
          '<button class="btn btn-sm" id="addStaff" type="button">Add</button></div>' +
          (rows.length ? '<div>' + rows.map(function (r) {
            var where = (r.centre_ids || []).map(centreName).join(", ");
            return '<div class="row" data-staff="' + r.id + '">' +
              '<div class="avatar">' + App.esc(App.initials(r.name)) + '</div>' +
              '<div class="row-main"><div class="row-t">' + App.esc(r.name) + '</div>' +
              '<div class="row-s">' + App.esc(r.email) + '</div>' +
              '<div class="row-s">' + App.esc(where || "No centre yet, so they see nothing") + '</div></div>' +
              (r.active ? "" : '<span class="status is-pending">Off</span>') + '</div>';
          }).join("") + '</div>'
          : '<div class="empty"><div class="empty-t">Nobody added yet</div>' +
            '<div class="small">Add a coach to let them take attendance for their own centres.</div></div>') +
        '</div>' +
        '<p class="small muted setup-foot">A coach can only open the register. Fees, ' +
        'reminders and parent phone numbers stay closed to them.</p>';

      App.$("#addStaff").addEventListener("click", function () { staffSheet(null); });
      App.$$("[data-staff]", view).forEach(function (el) {
        el.addEventListener("click", function () {
          staffSheet(rows.filter(function (r) { return r.id === +el.dataset.staff; })[0]);
        });
      });
    }).catch(function (e) { App.fail(view, e); });
  }

  function staffSheet(r) {
    var picked = (r && r.centre_ids ? r.centre_ids.slice() : []);
    var open = ref.centres.filter(function (c) { return c.active !== false; });
    App.sheet({

        '<div class="field"><label>Name</label><input class="input" id="n" value="' +
          App.esc(r ? r.name : "") + '" placeholder="Ravi Kumar"></div>' +
        '<div class="field"><label>Sign-in email ' +
          '<span class="hint">' + (r ? "cannot be changed here" : "the account they will sign in with") +
          '</span></label><input class="input" id="e" type="email" inputmode="email" ' +

          '<span>Centres they may mark</span></div>' +

          }).join("") + '</div></div>' +
        (r ? '<label class="small" style="display:flex;gap:9px;align-items:center;margin-bottom:14px">' +

             '> Active <span class="muted">unticking signs them out of the register</span></label>' : "") +
        '<button class="btn btn-primary btn-block" id="save">Save</button>',
      onMount: function (el) {
        App.$$("[data-c]", el).forEach(function (c) {
          c.addEventListener("click", function () {
            c.setAttribute("aria-pressed", String(c.getAttribute("aria-pressed") !== "true"));
          });
        });
        App.$("#save", el).addEventListener("click", function () {
          var btn = this;
          var name = App.$("#n", el).value.trim();
          var email = App.$("#e", el).value.trim();
          var centres = App.$$("[data-c]", el)
            .filter(function (c) { return c.getAttribute("aria-pressed") === "true"; })
            .map(function (c) { return +c.dataset.c; });
          if (!name)  { App.toast("Enter a name.", "bad"); return; }
          if (!email) { App.toast("Enter the email they sign in with.", "bad"); return; }
          if (!centres.length) {
            App.toast("Pick at least one centre, or they will see nothing.", "bad"); return;
          }
          btn.disabled = true; btn.textContent = "Saving…";
          RS.setStaffScope({ email: email, name: name, centres: centres,
                             active: r ? App.$("#ac", el).checked : true })
            .then(function (res) {
              App.closeSheet();
              App.toast(res && res.linked === false
                ? "Saved. They can take the register once their sign-in is created."
                : "Saved", "good");
              renderStaff();
            })
            .catch(function (e) {
              btn.disabled = false; btn.textContent = "Save";
              App.toast(e.message || "Could not save.", "bad");
            });
        });
      }
    });
  }

          : "") +
        '<div class="card section reveal"><div class="card-hd"><h2>App errors</h2>' +
          '<span class="pill ' + (use.errors_30d ? "pill-overdue" : "pill-paid") + '">' +
          (use.errors_30d || 0) + " in 30 days</span></div>" +
          '<div class="card-pad small muted">Anything that breaks reports itself here and to the ' +
          "Academy Manager console. " + (use.last_event_at ? "Last used " +
            App.esc(new Date(use.last_event_at).toLocaleString("en-IN",
              { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })) + "." : "") +
          "</div></div>" +
        '<div class="card reveal"><div class="card-hd"><h2>Recent changes</h2></div><div id="au"></div></div>';

      var host = App.$("#au");
      if (!rows.length) return App.empty(host, "No changes yet", "Every fee and batch edit is recorded here.");
      host.innerHTML = '<div class="list">' + rows.map(function (a, i) {
        return '<div class="row row-in" style="animation-delay:' + Math.min(i * 26, 260) + 'ms">' +
          '<div class="row-main"><div class="row-t">' + App.esc(auditTitle(a)) + "</div>" +
          '<div class="row-s">' + App.esc(new Date(a.at).toLocaleString("en-IN",
            { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) +
            " · " + (a.actor || "system")) + "</div></div>" +
          '<div class="row-end"><span class="pill">' +
            App.esc(String(a.action).replace(/_/g, " ")) + "</span></div></div>";
      }).join("") + "</div>";
    }).catch(function (e) { App.fail(view, e); });
  }
  function mtr(k, v, sub, cls) {
    return '<div class="metric ' + cls + '"><div class="eyebrow">' + App.esc(k) + "</div>" +
      '<div class="metric-v">' + App.esc(String(v)) + "</div>" +
      '<div class="metric-s">' + App.esc(sub) + "</div></div>";
  }
  function auditTitle(a) {
    var d = a.after || a.before || {};
    var what = d.label || d.name || ("#" + a.entity_id);
    if (a.action === "timing_changed") return "Timing changed for " + what;
    if (a.entity === "fee_rule" && a.before && a.after &&
        a.before.monthly_amount !== a.after.monthly_amount) {
      return "Fee " + App.money(a.before.monthly_amount) + " to " +
             App.money(a.after.monthly_amount) + " for " + what;
    }
    return App.cap(String(a.entity).replace(/_/g, " ")) + " " + what;
  }
})();
</script>
</body>
</html>
